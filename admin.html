<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>অ্যাডমিন</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f7f1;margin:0;padding:12px}.c{background:#fff;border:1px solid #dbe4d6;border-radius:12px;padding:12px;margin:10px auto;max-width:640px}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd5c4}button{background:#1f4d36;color:#fff;border:0}small{color:#5a6b60}</style></head><body>
<div class="c"><b>অর্ডার ম্যানেজার</b> <button onclick="load()" style="float:right">রিফ্রেশ</button></div><div id="l"></div>
<script>
const S={pending:'নতুন',confirmed:'নিশ্চিত',shipping:'পথে',delivered:'ডেলিভারড',cancelled:'বাতিল'};
let pw=sessionStorage.pw||prompt('অ্যাডমিন পাসওয়ার্ড');
async function load(){const r=await fetch('/api/admin',{headers:{'x-admin':pw}});
 if(!r.ok){sessionStorage.pw='';l.innerHTML='<div class="c">পাসওয়ার্ড ভুল। রিফ্রেশ করে আবার দিন।</div>';return}
 sessionStorage.pw=pw;const d=await r.json();
 l.innerHTML=d.map(o=>`<div class="c"><b>#${o.id}</b> · ${o.total}৳ · ${o.payment=='bkash'?'bKash '+(o.trx_id||''):'COD'}<br>${o.name} · <a href="tel:${o.phone}">${o.phone}</a><br><small>${o.area}: ${o.address}${o.note?' · '+o.note:''}</small><br><small>${o.items.map(i=>i.name+'×'+i.qty).join(', ')}</small><br>
 <select onchange="set('${o.id}',this.value)">${Object.entries(S).map(([k,v])=>`<option value="${k}" ${k==o.status?'selected':''}>${v}</option>`).join('')}</select> <small>${new Date(o.created_at).toLocaleString('bn-BD')}</small></div>`).join('')||'<div class="c">কোনো অর্ডার নেই।</div>'}
async function set(id,status){const r=await fetch('/api/admin',{method:'POST',headers:{'x-admin':pw,'Content-Type':'application/json'},body:JSON.stringify({id,status})});if(!r.ok)alert('আপডেট হয়নি')}
load();
</script></body></html>
